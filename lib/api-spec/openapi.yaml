openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: images
    description: Image generation operations
  - name: vault
    description: Encrypted provider API key vault operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /images/generate:
    post:
      operationId: generateStoryImages
      tags: [images]
      summary: Generate images for a story
      description: Generates images on the server using the configured provider fallback chain.
      security:
        - FirebaseBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImageGenerationInput"
      responses:
        "200":
          description: Generated images, including partial success information.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImageGenerationResult"
        "400":
          description: Invalid generation request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Missing or invalid Firebase ID token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: The story has reached its image limit.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "502":
          description: All image providers failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /vault/keys:
    get:
      operationId: listVaultKeys
      tags: [vault]
      summary: List masked API key metadata
      security:
        - FirebaseBearerAuth: []
      responses:
        "200":
          description: Masked key metadata; secret values are never returned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VaultKeyList"
        "401":
          description: Missing or invalid Firebase ID token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    post:
      operationId: createVaultKey
      tags: [vault]
      summary: Add an encrypted provider API key
      security:
        - FirebaseBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateVaultKeyInput"
      responses:
        "201":
          description: Masked metadata for the newly created key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VaultKey"
        "400":
          description: Invalid key metadata.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Missing or invalid Firebase ID token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /vault/keys/{provider}/{keyId}:
    parameters:
      - name: provider
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/ProviderId"
      - name: keyId
        in: path
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 128
    patch:
      operationId: updateVaultKey
      tags: [vault]
      summary: Update a key label or enabled state
      security:
        - FirebaseBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateVaultKeyInput"
      responses:
        "200":
          description: Updated masked key metadata.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VaultKey"
        "400":
          description: Invalid key metadata.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Missing or invalid Firebase ID token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Key not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    delete:
      operationId: deleteVaultKey
      tags: [vault]
      summary: Delete a provider API key
      security:
        - FirebaseBearerAuth: []
      responses:
        "204":
          description: Key deleted.
        "401":
          description: Missing or invalid Firebase ID token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Key not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ImageGenerationInput:
      type: object
      properties:
        storyId:
          type: ["string", "null"]
          maxLength: 200
        prompt:
          type: string
          minLength: 1
          maxLength: 4000
        count:
          type: integer
          minimum: 1
          maximum: 4
      required: [storyId, prompt, count]
    GeneratedImage:
      type: object
      properties:
        base64:
          type: string
        url:
          type: string
          format: uri
        mimeType:
          type: string
        sizeBytes:
          type: integer
          minimum: 0
        provider:
          type: string
          enum: [agnes, glm, zsky, pollinations]
      required: [provider]
    ImageGenerationResult:
      type: object
      properties:
        images:
          type: array
          items:
            $ref: "#/components/schemas/GeneratedImage"
        failedCount:
          type: integer
        skippedCount:
          type: integer
      required: [images, failedCount, skippedCount]
    ApiError:
      type: object
      properties:
        error:
          type: string
        code:
          type: string
        failedCount:
          type: integer
        skippedCount:
          type: integer
      required: [error, code]
    ProviderId:
      type: string
      enum: [zsky, agnes, glm]
    VaultKey:
      type: object
      properties:
        id:
          type: string
        provider:
          $ref: "#/components/schemas/ProviderId"
        label:
          type: string
        maskedValue:
          type: string
        enabled:
          type: boolean
        createdAt:
          type: integer
          format: int64
        status:
          type: string
          enum: [ready, failing, cooldown]
        cooldownUntil:
          type: ["integer", "null"]
          format: int64
      required: [id, provider, label, maskedValue, enabled, createdAt, status]
    VaultKeyList:
      type: object
      properties:
        keys:
          type: array
          items:
            $ref: "#/components/schemas/VaultKey"
      required: [keys]
    CreateVaultKeyInput:
      type: object
      properties:
        provider:
          $ref: "#/components/schemas/ProviderId"
        label:
          type: string
          minLength: 1
          maxLength: 80
        value:
          type: string
          minLength: 1
          maxLength: 4096
      required: [provider, label, value]
    UpdateVaultKeyInput:
      type: object
      properties:
        label:
          type: string
          minLength: 1
          maxLength: 80
        enabled:
          type: boolean
      minProperties: 1
  securitySchemes:
    FirebaseBearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Firebase ID token

