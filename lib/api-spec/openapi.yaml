openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: images
    description: Image generation operations
  - name: vault
    description: Encrypted provider API key vault operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /images/generate:
    post:
      operationId: generateStoryImages
      tags: [images]
      summary: Generate images for a story
      description: Generates images on the server using the configured provider fallback chain.
      security:
        - FirebaseBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImageGenerationInput"
      responses:
        "200":
          description: Generated images, including partial success information.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImageGenerationResult"
        "400":
          description: Invalid generation request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Missing or invalid Firebase ID token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: The story has reached its image limit.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "502":
          description: All image providers failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /images/storage-usage:
    get:
      operationId: getStorageUsage
      tags: [images]
      summary: Get Cloudinary storage usage
      security:
        - FirebaseBearerAuth: []
      responses:
        "200":
          description: Storage usage and configured state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StorageUsage"
  /images/stories/{storyId}/images:
    parameters:
      - name: storyId
        in: path
        required: true
        schema:
          type: string
          maxLength: 200
    post:
      operationId: saveStoryImage
      tags: [images]
      summary: Save an image to a story
      security:
        - FirebaseBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaveStoryImageInput"
      responses:
        "201":
          description: Image bytes are saved to the user's Firebase Storage story path.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoryImage"
  /images/stories/{storyId}/scenes:
    post:
      operationId: startStorySceneGeneration
      tags: [images]
      summary: Queue independent scene image jobs
      security:
        - FirebaseBearerAuth: []
      parameters:
        - name: storyId
          in: path
          required: true
          schema:
            type: string
            maxLength: 200
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SceneGenerationInput"
      responses:
        "202":
          description: Scene records were created and queued independently.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SceneGenerationAccepted"
        "409":
          description: Story image limit reached.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /images/stories/{storyId}/target-count:
    patch:
      operationId: updateStoryTargetCount
      tags: [images]
      summary: Update a story's target image count
      description: Sets a target from 1 to 100 and removes only pending or failed scenes above it.
      security:
        - FirebaseBearerAuth: []
      parameters:
        - name: storyId
          in: path
          required: true
          schema:
            type: string
            maxLength: 200
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StoryTargetCountInput"
      responses:
        "200":
          description: Target count updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoryTargetCountResult"
        "400":
          description: Invalid target count.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Missing or invalid Firebase ID token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Story not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /images/stories/{storyId}/scenes/resume:
    post:
      operationId: resumeStorySceneGeneration
      tags: [images]
      summary: Resume pending scene jobs
      security:
        - FirebaseBearerAuth: []
      parameters:
        - name: storyId
          in: path
          required: true
          schema:
            type: string
            maxLength: 200
      responses:
        "200":
          description: Pending jobs were added to the bounded queue.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SceneResumeResult"
  /images/stories/{storyId}/images/{imageId}/retry:
    post:
      operationId: retryStoryScene
      tags: [images]
      summary: Retry a failed scene image job
      security:
        - FirebaseBearerAuth: []
      parameters:
        - name: storyId
          in: path
          required: true
          schema:
            type: string
        - name: imageId
          in: path
          required: true
          schema:
            type: string
      responses:
        "202":
          description: The failed scene was queued for retry.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SceneRetryResult"
  /images/stories/{storyId}/images/{imageId}:
    parameters:
      - name: storyId
        in: path
        required: true
        schema:
          type: string
      - name: imageId
        in: path
        required: true
        schema:
          type: string
    delete:
      operationId: deleteStoryImage
      tags: [images]
      summary: Delete a story image
      security:
        - FirebaseBearerAuth: []
      responses:
        "204":
          description: Image deleted.
  /images/stories/{storyId}/download.zip:
    get:
      operationId: downloadStoryZip
      tags: [images]
      summary: Stream a short-lived story ZIP download
      parameters:
        - name: storyId
          in: path
          required: true
          schema:
            type: string
        - name: token
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Streamed ZIP containing separate scene images.
          content:
            application/zip:
              schema:
                type: string
                format: binary
  /images/stories/{storyId}/download-token:
    post:
      operationId: createStoryZipDownloadToken
      tags: [images]
      summary: Create a short-lived ZIP download link
      security:
        - FirebaseBearerAuth: []
      parameters:
        - name: storyId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: A signed short-lived navigation URL and progress token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoryZipDownloadToken"
  /images/stories/{storyId}/download-status:
    get:
      operationId: getStoryZipDownloadProgress
      tags: [images]
      summary: Read ZIP download progress
      security:
        - FirebaseBearerAuth: []
      parameters:
        - name: storyId
          in: path
          required: true
          schema:
            type: string
        - name: token
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Current ZIP progress for the authenticated story owner.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoryZipProgress"
  /vault/keys:
    get:
      operationId: listVaultKeys
      tags: [vault]
      summary: List masked API key metadata
      security:
        - FirebaseBearerAuth: []
      responses:
        "200":
          description: Masked key metadata; secret values are never returned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VaultKeyList"
        "401":
          description: Missing or invalid Firebase ID token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    post:
      operationId: createVaultKey
      tags: [vault]
      summary: Add an encrypted provider API key
      security:
        - FirebaseBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateVaultKeyInput"
      responses:
        "201":
          description: Masked metadata for the newly created key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VaultKey"
        "400":
          description: Invalid key metadata.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Missing or invalid Firebase ID token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /providers:
    get:
      operationId: listProviders
      tags: [vault]
      summary: List image and storage providers
      security:
        - FirebaseBearerAuth: []
      responses:
        "200":
          description: Provider settings and masked environment fallbacks.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderList"
  /vault/keys/{provider}/{keyId}:
    parameters:
      - name: provider
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/ProviderId"
      - name: keyId
        in: path
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 128
    delete:
      operationId: deleteVaultKey
      tags: [vault]
      summary: Delete a provider API key
      security:
        - FirebaseBearerAuth: []
      responses:
        "204":
          description: Key deleted.
        "401":
          description: Missing or invalid Firebase ID token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Key not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /vault/keys/{provider}/{keyId}/value:
    parameters:
      - name: provider
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/ProviderId"
      - name: keyId
        in: path
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 128
    put:
      operationId: replaceVaultKeyValue
      tags: [vault]
      summary: Replace a saved API key value
      security:
        - FirebaseBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReplaceVaultKeyValueInput"
      responses:
        "200":
          description: Updated masked key metadata.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VaultKey"
        "400":
          description: Invalid key value.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Missing or invalid Firebase ID token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Key not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ImageGenerationInput:
      type: object
      properties:
        storyId:
          type: "null"
        prompt:
          type: string
          minLength: 1
          maxLength: 20000
        count:
          type: integer
          minimum: 1
          maximum: 5
      required: [storyId, prompt, count]
    SceneGenerationInput:
      type: object
      properties:
        prompt:
          type: string
          minLength: 1
          maxLength: 20000
        count:
          type: integer
          minimum: 1
          maximum: 100
          description: Desired total number of scenes for the story.
      required: [prompt, count]
    StoryTargetCountInput:
      type: object
      properties:
        targetCount:
          type: integer
          minimum: 1
          maximum: 100
      required: [targetCount]
    StoryTargetCountResult:
      type: object
      properties:
        targetCount:
          type: integer
        removedCount:
          type: integer
          minimum: 0
      required: [targetCount, removedCount]
    SceneGenerationAccepted:
      type: object
      properties:
        batchId:
          type: string
        sceneCount:
          type: integer
        skippedCount:
          type: integer
      required: [batchId, sceneCount, skippedCount]
    SceneResumeResult:
      type: object
      properties:
        resumedCount:
          type: integer
      required: [resumedCount]
    SceneRetryResult:
      type: object
      properties:
        queued:
          type: boolean
      required: [queued]
    StoryZipDownloadToken:
      type: object
      properties:
        downloadUrl:
          type: string
        token:
          type: string
        imageCount:
          type: integer
      required: [downloadUrl, token, imageCount]
    StoryZipProgress:
      type: object
      properties:
        status:
          type: string
          enum: [ready, zipping, done, failed]
        completedCount:
          type: integer
        imageCount:
          type: integer
      required: [status, completedCount, imageCount]
    GeneratedImage:
      type: object
      properties:
        base64:
          type: string
        url:
          type: string
          format: uri
        mimeType:
          type: string
        sizeBytes:
          type: integer
          minimum: 0
        thumbnailUrl:
          type: string
          format: uri
        publicId:
          type: string
        folder:
          type: string
        sequence:
          type: integer
          minimum: 1
        savedToFactory:
          type: boolean
        provider:
          type: string
      required: [provider]
    ImageGenerationResult:
      type: object
      properties:
        images:
          type: array
          items:
            $ref: "#/components/schemas/GeneratedImage"
        failedCount:
          type: integer
        skippedCount:
          type: integer
      required: [images, failedCount, skippedCount]
    ApiError:
      type: object
      properties:
        error:
          type: string
        code:
          type: string
        failedCount:
          type: integer
        skippedCount:
          type: integer
      required: [error, code]
    ProviderId:
      type: string
      pattern: "^[a-z0-9][a-z0-9-]{0,63}$"
    StorageUsage:
      type: object
      properties:
        configured:
          type: boolean
        usedBytes:
          type: ["integer", "null"]
        limitBytes:
          type: ["integer", "null"]
      required: [configured, usedBytes, limitBytes]
    ProviderConfig:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        category:
          type: string
          enum: [image, storage]
        adapter:
          type: string
          enum: [agnes, glm, zsky, pollinations, cloudinary, openai-compatible]
        enabled:
          type: boolean
        rotationOrder:
          type: integer
        baseUrl:
          type: string
        model:
          type: string
        builtIn:
          type: boolean
        secretFallback:
          type: string
      required: [id, name, category, adapter, enabled, rotationOrder, builtIn]
    ProviderList:
      type: object
      properties:
        providers:
          type: array
          items:
            $ref: "#/components/schemas/ProviderConfig"
      required: [providers]
    ProviderConfigInput:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        category:
          type: string
          enum: [image, storage]
        adapter:
          type: string
          enum: [agnes, glm, zsky, pollinations, cloudinary, openai-compatible]
        enabled:
          type: boolean
        rotationOrder:
          type: integer
        baseUrl:
          type: string
        model:
          type: string
      required: [name, category, adapter]
    ProviderUpdateInput:
      type: object
      properties:
        enabled:
          type: boolean
        rotationOrder:
          type: integer
      minProperties: 1
    SaveStoryImageInput:
      type: object
      properties:
        imageData:
          type: string
        prompt:
          type: string
          maxLength: 20000
        provider:
          type: string
      required: [imageData]
    StoryImage:
      type: object
      properties:
        id:
          type: string
        index:
          type: integer
          minimum: 1
        scenePrompt:
          type: string
        imageUrl:
          type: string
          format: uri
        url:
          type: string
          format: uri
        thumbnailUrl:
          type: string
          format: uri
        publicId:
          type: string
        folder:
          type: string
        sequence:
          type: integer
          minimum: 1
        prompt:
          type: string
        sizeBytes:
          type: integer
        storagePath:
          type: string
        provider:
          type: string
        status:
          type: string
          enum: [pending, generating, done, failed]
        error:
          type: string
      required: [id, url, prompt, sizeBytes, storagePath, provider]
    VaultKey:
      type: object
      properties:
        id:
          type: string
        provider:
          $ref: "#/components/schemas/ProviderId"
        label:
          type: string
        maskedValue:
          type: string
        enabled:
          type: boolean
        createdAt:
          type: integer
          format: int64
        status:
          type: string
          enum: [ready, failing, cooldown]
        cooldownUntil:
          type: ["integer", "null"]
          format: int64
      required: [id, provider, label, maskedValue, enabled, createdAt, status]
    VaultKeyList:
      type: object
      properties:
        keys:
          type: array
          items:
            $ref: "#/components/schemas/VaultKey"
      required: [keys]
    CreateVaultKeyInput:
      type: object
      properties:
        provider:
          $ref: "#/components/schemas/ProviderId"
        label:
          type: string
          minLength: 1
          maxLength: 80
          pattern: '^(AGNES|GLM)_API_KEY(?:_([2-9]|[1-9][0-9]+))?$'
        value:
          type: string
          minLength: 1
          maxLength: 4096
      required: [provider, label, value]
    ReplaceVaultKeyValueInput:
      type: object
      properties:
        value:
          type: string
          minLength: 1
          maxLength: 4096
      required: [value]
  securitySchemes:
    FirebaseBearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Firebase ID token

